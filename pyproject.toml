[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elemental-society-analysis"
version = "1.0.0"
description = "Geochemical data analysis platform with anomaly detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "PyQt5>=5.15",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.0.280",
]

[project.scripts]
esa = "elemental_society_analysis.app:main"

[tool.setuptools.packages.find]
where = ["src"]